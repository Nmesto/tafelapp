<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tafelapp</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-white text-dark">

    <div class="container my-5">
        <h1 class="text-center mb-1">Tafelapp</h1>
        <p class="text-center text-muted mb-4">Made by Nashat</p>
        
        <!-- 3 Kolommen Grid -->
        <div class="row">
            
            <!-- ONDERDEEL 1: Genereer de tafel -->
            <div class="col-md-4 mb-3">
                <div class="card h-100 border-dark shadow-sm">
                    <div class="card-header bg-dark text-white">
                        <h5 class="mb-0">1. Genereer Tafel</h5>
                    </div>
                    <div class="card-body">
                        <div class="mb-3">
                            <label for="getalOnderdeel1" class="form-label">Welke tafel?</label>
                            <input type="number" id="getalOnderdeel1" class="form-control" placeholder="Bijv. 6">
                        </div>
                        <button class="btn btn-dark w-100" onclick="genereerTafel()">Genereer</button>
                        <hr>
                        <div id="resultaatOnderdeel1" class="mt-3 font-monospace"></div>
                    </div>
                </div>
            </div>

            <!-- ONDERDEEL 2: Tafel oefenen -->
            <div class="col-md-4 mb-3">
                <div class="card h-100 border-dark shadow-sm">
                    <div class="card-header bg-dark text-white">
                        <h5 class="mb-0">2. Tafel Oefenen</h5>
                    </div>
                    <div class="card-body">
                        <div class="mb-3">
                            <label for="getalOnderdeel2" class="form-label">Welke tafel wil je oefenen?</label>
                            <input type="number" id="getalOnderdeel2" class="form-control" placeholder="Bijv. 6">
                        </div>
                        <button class="btn btn-dark w-100 mb-3" onclick="startOefening2()">Start Oefening</button>
                        
                        <div id="vraagContainer2" class="mt-3" style="display: none;">
                            <p id="somTekst2" class="fw-bold fs-5"></p>
                            <div class="mb-3">
                                <input type="number" id="antwoordOnderdeel2" class="form-control" placeholder="Je antwoord" onkeydown="checkEnter2(event)">
                            </div>
                            <button class="btn btn-outline-dark w-100" onclick="controleerAntwoord2()">Controleer</button>
                        </div>
                        <div id="feedback2" class="mt-3 fw-bold"></div>
                    </div>
                </div>
            </div>

            <!-- ONDERDEEL 3: Tafels oefenen -->
            <div class="col-md-4 mb-3">
                <div class="card h-100 border-dark shadow-sm">
                    <div class="card-header bg-dark text-white">
                        <h5 class="mb-0">3. Tafels Oefenen</h5>
                    </div>
                    <div class="card-body">
                        <div class="row mb-3">
                            <div class="col-6">
                                <label for="minRange" class="form-label">Van tafel:</label>
                                <input type="number" id="minRange" class="form-control" value="3">
                            </div>
                            <div class="col-6">
                                <label for="maxRange" class="form-label">Tot tafel:</label>
                                <input type="number" id="maxRange" class="form-control" value="7">
                            </div>
                        </div>
                        <button class="btn btn-dark w-100 mb-3" onclick="startOefening3()">Start Oefening</button>
                        
                        <div id="vraagContainer3" class="mt-3" style="display: none;">
                            <p id="somTekst3" class="fw-bold fs-5"></p>
                            <div class="mb-3">
                                <input type="number" id="antwoordOnderdeel3" class="form-control" placeholder="Je antwoord" onkeydown="checkEnter3(event)">
                            </div>
                            <button class="btn btn-outline-dark w-100" onclick="controleerAntwoord3()">Controleer</button>
                        </div>
                        <div id="feedback3" class="mt-3 fw-bold"></div>
                    </div>
                </div>
            </div>

        </div>
    </div>

    <!-- JavaScript Logica -->
    <script>
        // --- ONDERDEEL 1 ---
        function genereerTafel() {
            let getal = parseInt(document.getElementById('getalOnderdeel1').value);
            let container = document.getElementById('resultaatOnderdeel1');
            container.innerHTML = '';

            if (isNaN(getal)) {
                container.innerHTML = '<span class="text-danger">Vul eerst een geldig getal in!</span>';
                return;
            }

            let html = '';
            for (let i = 1; i <= 10; i++) {
                html += `${i} × ${getal} = ${i * getal}<br>`;
            }
            container.innerHTML = html;
        }

        // --- ONDERDEEL 2 ---
        let huidigAntwoord2 = 0;
        let gekozenTafel2 = 0;

        function startOefening2() {
            gekozenTafel2 = parseInt(document.getElementById('getalOnderdeel2').value);
            let feedback = document.getElementById('feedback2');
            feedback.innerHTML = '';

            if (isNaN(gekozenTafel2)) {
                feedback.innerHTML = '<span class="text-danger">Vul een tafel in!</span>';
                return;
            }

            document.getElementById('vraagContainer2').style.display = 'block';
            nieuweVraag2();
        }

        function nieuweVraag2() {
            let factor = Math.floor(Math.random() * 10) + 1;
            huidigAntwoord2 = factor * gekozenTafel2;
            document.getElementById('somTekst2').innerText = `${factor} × ${gekozenTafel2} = `;
            document.getElementById('antwoordOnderdeel2').value = '';
            document.getElementById('antwoordOnderdeel2').focus();
            document.getElementById('feedback2').innerHTML = '';
        }

        function controleerAntwoord2() {
            let ingevoerd = parseInt(document.getElementById('antwoordOnderdeel2').value);
            let feedback = document.getElementById('feedback2');

            if (ingevoerd === huidigAntwoord2) {
                feedback.innerHTML = '<span class="text-success">Goed!</span>';
                setTimeout(nieuweVraag2, 1000);
            } else {
                feedback.innerHTML = '<span class="text-danger">Fout, probeer het nog eens!</span>';
                document.getElementById('antwoordOnderdeel2').focus();
            }
        }

        function checkEnter2(event) {
            if (event.key === 'Enter') {
                controleerAntwoord2();
            }
        }

        // --- ONDERDEEL 3 ---
        let huidigAntwoord3 = 0;
        let minTafel = 0;
        let maxTafel = 0;

        function startOefening3() {
            minTafel = parseInt(document.getElementById('minRange').value);
            maxTafel = parseInt(document.getElementById('maxRange').value);
            let feedback = document.getElementById('feedback3');
            feedback.innerHTML = '';

            if (isNaN(minTafel) || isNaN(maxTafel) || minTafel > maxTafel) {
                feedback.innerHTML = '<span class="text-danger">Controleer je range!</span>';
                return;
            }

            document.getElementById('vraagContainer3').style.display = 'block';
            nieuweVraag3();
        }

        function nieuweVraag3() {
            let tafel = Math.floor(Math.random() * (maxTafel - minTafel + 1)) + minTafel;
            let factor = Math.floor(Math.random() * 10) + 1;
            
            huidigAntwoord3 = tafel * factor;
            document.getElementById('somTekst3').innerText = `${factor} × ${tafel} = `;
            document.getElementById('antwoordOnderdeel3').value = '';
            document.getElementById('antwoordOnderdeel3').focus();
            document.getElementById('feedback3').innerHTML = '';
        }

        function controleerAntwoord3() {
            let ingevoerd = parseInt(document.getElementById('antwoordOnderdeel3').value);
            let feedback = document.getElementById('feedback3');

            if (ingevoerd === huidigAntwoord3) {
                feedback.innerHTML = '<span class="text-success">Goed!</span>';
                setTimeout(nieuweVraag3, 1000);
            } else {
                feedback.innerHTML = '<span class="text-danger">Fout, probeer het nog eens!</span>';
                document.getElementById('antwoordOnderdeel3').focus();
            }
        }

        function checkEnter3(event) {
            if (event.key === 'Enter') {
                controleerAntwoord3();
            }
        }
    </script>
</body>
</html>
